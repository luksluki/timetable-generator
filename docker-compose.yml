services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schedulecraft-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://schedulecraft:schedulecraft@db:5432/schedulecraft?schema=public"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: schedulecraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedulecraft
      POSTGRES_PASSWORD: schedulecraft
      POSTGRES_DB: schedulecraft
    ports:
      - "5433:5432"
    volumes:
      - schedulecraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulecraft -d schedulecraft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schedulecraft_pgdata:
